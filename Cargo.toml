[package]
name = "kv"
version = "0.1.0"
edition = "2021"

# Panic-safety gate. From the "Rust: Don't Panic" video (No Boilerplate,
# https://www.youtube.com/watch?v=usRlRCNIOG0): chapter 9 of the Rust book
# names three ways Rust code crashes - (1) explicit `panic!`, (2) implicit
# panics like out-of-bounds indexing, (3) unwrapping an `Err`/`None` - and
# the fix is to have local tooling AND CI throw out any code that can hit
# them. `deny` here only affects `cargo clippy` runs (never plain `cargo
# build`/`check`), so it can't slow down or break routine compilation; it's
# enforced by .github/workflows/ci-required.yml. Test code is exempted via
# clippy.toml's `allow-*-in-tests` keys. `pedantic`/`nursery` (the video's
# "teach you good habits" tier, explicitly not false-positive-free) are
# deliberately NOT declared here - see ci-advisory.yml instead.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[[bin]]
name = "kv"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive", "env"] }
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow      = "1"
dirs        = "5"
rpassword   = "7"
tabled      = "0.15"
qrcode      = "0.14"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
p256        = { version = "0.13", features = ["ecdh", "pkcs8"] }
aes-gcm     = "0.10"
hkdf        = "0.12"
sha2        = "0.10"
md-5        = "0.10"
base64      = "0.22"
rand_core   = { version = "0.6", features = ["getrandom"] }
zeroize     = "1"
clap_mangen = "0.2"
async-trait = "0.1"
